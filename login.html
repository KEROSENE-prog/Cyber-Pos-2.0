<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — CyberPOS Gaming</title>
  <meta name="description" content="Inicia sesión como administrador o cliente en CyberPOS Laneros Gamer.">
  <link rel="stylesheet" href="styles.css">
  <style>
    main.auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background-image: linear-gradient(rgba(10,10,10,.85), rgba(53,192,41,.4)), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070');
      background-size: cover;
      background-position: center;
    }
    article.auth-card {
      background-color: var(--bg-card);
      padding: 40px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      border-top: 4px solid var(--brand-primary);
      box-shadow: 0 20px 50px rgba(0,0,0,.6);
    }
    header.auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    header.auth-header h1 {
      color: var(--brand-primary);
      font-size: 2rem;
      margin-bottom: 4px;
    }
    header.auth-header p {
      color: var(--text-muted);
      font-size: .95rem;
    }
    form.auth-form fieldset {
      border: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    p.form-group { display: flex; flex-direction: column; gap: 6px; }
    p.form-group label { font-weight: 600; color: var(--text-muted); font-size: .9rem; }
    .role-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px;
      background: rgba(0,0,0,.25);
    }
    .role-tabs button {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border-radius: 9px;
      padding: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: .95rem;
      transition: color .25s, border-color .25s, box-shadow .25s, background .25s;
    }
    .role-tabs button:not(.active):hover {
      color: var(--text-main);
      background: rgba(255,255,255,.04);
    }
    .role-tabs button.active {
      background: rgba(255,255,255,.05);
      color: var(--brand-primary);
      font-weight: 700;
      border-color: color-mix(in srgb, var(--brand-primary) 80%, transparent);
      box-shadow:
        0 0 8px color-mix(in srgb, var(--brand-primary) 55%, transparent),
        0 0 18px color-mix(in srgb, var(--brand-primary) 30%, transparent),
        inset 0 0 12px color-mix(in srgb, var(--brand-primary) 22%, transparent);
      animation: tabNeon 2.6s ease-in-out infinite;
    }
    @keyframes tabNeon {
      0%, 100% {
        box-shadow:
          0 0 7px color-mix(in srgb, var(--brand-primary) 45%, transparent),
          0 0 14px color-mix(in srgb, var(--brand-primary) 22%, transparent),
          inset 0 0 10px color-mix(in srgb, var(--brand-primary) 16%, transparent);
      }
      50% {
        box-shadow:
          0 0 13px color-mix(in srgb, var(--brand-primary) 70%, transparent),
          0 0 28px color-mix(in srgb, var(--brand-primary) 40%, transparent),
          inset 0 0 14px color-mix(in srgb, var(--brand-primary) 26%, transparent);
      }
    }
    footer.auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: .9rem;
      color: var(--text-muted);
    }
    footer.auth-footer a { color: var(--brand-primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main class="auth-page">
    <article class="auth-card">
      <header class="auth-header">
        <h1>CyberPOS</h1>
        <p>Laneros Gamer — Inicia sesión</p>
      </header>
      <nav class="role-tabs">
        <button class="active" type="button" data-rol="cliente">Cliente</button>
        <button type="button" data-rol="administrador">Administrador</button>
      </nav>
      <form class="auth-form" id="loginForm">
        <fieldset>
          <p class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email">
          </p>
          <p class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          </p>
          <button type="submit" class="primary" style="width:100%;padding:14px;font-size:1rem;margin-top:4px">Ingresar →</button>
        </fieldset>
      </form>
      <footer class="auth-footer">
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </footer>
    </article>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
